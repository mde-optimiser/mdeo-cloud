# Sends "Connection: upgrade" only for WebSocket requests, and leaves ordinary proxied
# requests on keep-alive. Plugin services are reached through this proxy by the backend as
# well as the browser, and the backend opens WebSocket connections to them for execution
# results, so every plugin location has to be able to carry an upgrade.
#
# Only "websocket" counts. Java's HttpClient defaults to HTTP/2 and asks every cleartext
# connection to upgrade with "Upgrade: h2c", so forwarding upgrades indiscriminately made
# the plugin services' WebSocket handler reject the backend's file-data POSTs and turned
# every AST computation into a 502.
map $http_upgrade $connection_upgrade {
    ~*^websocket$ upgrade;
    default       close;
}

# The Upgrade header itself must be dropped for the same reason: passing "h2c" through is
# what the plugin services trip over.
map $http_upgrade $proxy_upgrade {
    ~*^websocket$ $http_upgrade;
    default       "";
}

server {
    listen 80;

    # Request bodies carry whole files: the backend POSTs a file's full source text to the
    # plugin services through this proxy to have its data computed. nginx defaults to 1m,
    # which rejects any model larger than that with a 413. Kept in line with the plugin
    # services' own limit (MAX_REQUEST_BODY_BYTES, default 64m in service-common).
    client_max_body_size 64m;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Cross-origin isolation (required for SharedArrayBuffer / Atomics)
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;

    # Metamodel plugin 
    location ^~ /plugin/metamodel/ {
        proxy_pass ${PLUGIN_METAMODEL_SERVICE}/;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Execution results are read over a WebSocket the backend holds open to this service.
        proxy_set_header Upgrade $proxy_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        add_header Cross-Origin-Resource-Policy "cross-origin" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
    }

    # Model plugin
    location ^~ /plugin/model/ {
        proxy_pass ${PLUGIN_MODEL_SERVICE}/;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Execution results are read over a WebSocket the backend holds open to this service.
        proxy_set_header Upgrade $proxy_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        add_header Cross-Origin-Resource-Policy "cross-origin" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
    }

    # Script plugin
    location ^~ /plugin/script/ {
        proxy_pass ${PLUGIN_SCRIPT_SERVICE}/;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Execution results are read over a WebSocket the backend holds open to this service.
        proxy_set_header Upgrade $proxy_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        add_header Cross-Origin-Resource-Policy "cross-origin" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
    }

    # CSV plugin
    location ^~ /plugin/csv/ {
        proxy_pass ${PLUGIN_CSV_SERVICE}/;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Execution results are read over a WebSocket the backend holds open to this service.
        proxy_set_header Upgrade $proxy_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        add_header Cross-Origin-Resource-Policy "cross-origin" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
    }

    # Model-transformation plugin
    location ^~ /plugin/model-transformation/ {
        proxy_pass ${PLUGIN_MODEL_TRANSFORMATION_SERVICE}/;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Execution results are read over a WebSocket the backend holds open to this service.
        proxy_set_header Upgrade $proxy_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        add_header Cross-Origin-Resource-Policy "cross-origin" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
    }

    # Config plugin
    location ^~ /plugin/config/ {
        proxy_pass ${PLUGIN_CONFIG_SERVICE}/;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Execution results are read over a WebSocket the backend holds open to this service.
        proxy_set_header Upgrade $proxy_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        add_header Cross-Origin-Resource-Policy "cross-origin" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
    }

    # Config-optimization plugin
    location ^~ /plugin/config-optimization/ {
        proxy_pass ${PLUGIN_CONFIG_OPTIMIZATION_SERVICE}/;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Execution results are read over a WebSocket the backend holds open to this service.
        proxy_set_header Upgrade $proxy_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        add_header Cross-Origin-Resource-Policy "cross-origin" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
    }

    # Config-mdeo plugin
    location ^~ /plugin/config-mdeo/ {
        proxy_pass ${PLUGIN_CONFIG_MDEO_SERVICE}/;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Execution results are read over a WebSocket the backend holds open to this service.
        proxy_set_header Upgrade $proxy_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        add_header Cross-Origin-Resource-Policy "cross-origin" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
    }

    # Model-csv plugin
    location ^~ /plugin/model-csv/ {
        proxy_pass ${PLUGIN_MODEL_CSV_SERVICE}/;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Execution results are read over a WebSocket the backend holds open to this service.
        proxy_set_header Upgrade $proxy_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        add_header Cross-Origin-Resource-Policy "cross-origin" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
    }

    # Proxy API requests to backend
    location ^~ /api/ {
        proxy_pass ${BACKEND_SERVICE};
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        proxy_set_header Cookie $http_cookie;
        proxy_pass_header Set-Cookie;
        
        proxy_connect_timeout 60s;
        # A file-data request blocks on the backend computing it, and the backend gives that
        # computation 5 minutes (FILE_DATA_COMPUTATION_TIMEOUT_SECONDS). Cutting the client
        # off at 60s only threw away work that was still running and invited a retry.
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
    }

    location ^~ /api/ws {
        proxy_pass ${BACKEND_SERVICE};
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Upgrade $proxy_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Cookie $http_cookie;
        proxy_pass_header Set-Cookie;

        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Git smart HTTP: clone/fetch/push against a project's repository. Basic
    # auth credentials go straight through, git does not use the session
    # cookie.
    location ^~ /git/ {
        proxy_pass ${BACKEND_SERVICE};
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Above the server-wide 64m default (kept there for plugin file-data
        # requests) to match the backend's own GIT_MAX_PUSH_PACK_SIZE_BYTES
        # default, so a push under that limit gets the backend's git-level
        # rejection message rather than an nginx 413 with no such context.
        client_max_body_size 100m;

        proxy_connect_timeout 60s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
    }

    # Non-html files (hashed filenames — safe to cache indefinitely)
    location ~* \.(?!html$)[a-zA-Z0-9]+$ {
        root   /usr/share/nginx/html;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        try_files $uri =404;
    }

    # Html files
    location / {
        root   /usr/share/nginx/html;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        expires 0;
        try_files $uri $uri/ /index.html;
    }
}
