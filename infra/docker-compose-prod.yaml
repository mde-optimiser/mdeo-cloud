    environment:
      SERVER_PORT: "8080"
      DATABASE_URL: ${OPTIMIZER_EXECUTION_DATABASE_URL:-jdbc:postgresql://postgres-optimizer:5432/mdeo}
      DATABASE_USER: ${OPTIMIZER_DB_USER:-${DATABASE_USER}}
      DATABASE_PASSWORD: ${OPTIMIZER_DB_PASSWORD:-${DATABASE_PASSWORD}}
      BACKEND_API_URL: ${OPTIMIZER_EXECUTION_BACKEND_URL:-http://backend:8080}
      SCRIPT_TIMEOUT_MS: ${SCRIPT_TIMEOUT_MS:-1000}
      TRANSFORMATION_TIMEOUT_MS: ${TRANSFORMATION_TIMEOUT_MS:-1000}
      NODE_ID: "2"
      PEERS: "http://optimizer-execution-0:8080,http://optimizer-execution-1:8080"
      NODE_URL: "http://optimizer-execution-2:8080"
      WORKER_THREADS: "1"
    depends_on:
      postgres-optimizer:
        condition: service_healthy
      backend:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

volumes:
  postgres-backend-data:
  postgres-script-data:
  postgres-model-transformation-data:
  postgres-optimizer-data:
