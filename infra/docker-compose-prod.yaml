services:
  postgres-backend:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${BACKEND_DB_USER:-${DATABASE_USER}}
      POSTGRES_PASSWORD: ${BACKEND_DB_PASSWORD:-${DATABASE_PASSWORD}}
      POSTGRES_DB: mdeo
    volumes:
      - postgres-backend-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${BACKEND_DB_USER:-${DATABASE_USER}} -d mdeo"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  postgres-script:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${SCRIPT_DB_USER:-${DATABASE_USER}}
      POSTGRES_PASSWORD: ${SCRIPT_DB_PASSWORD:-${DATABASE_PASSWORD}}
      POSTGRES_DB: mdeo
    volumes:
      - postgres-script-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${SCRIPT_DB_USER:-${DATABASE_USER}} -d mdeo"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
  
  postgres-model-transformation:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${MODEL_TRANSFORMATION_DB_USER:-${DATABASE_USER}}
      POSTGRES_PASSWORD: ${MODEL_TRANSFORMATION_DB_PASSWORD:-${DATABASE_PASSWORD}}
      POSTGRES_DB: mdeo
    volumes:
      - postgres-model-transformation-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${MODEL_TRANSFORMATION_DB_USER:-${DATABASE_USER}} -d mdeo"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  postgres-optimizer:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${OPTIMIZER_DB_USER:-${DATABASE_USER}}
      POSTGRES_PASSWORD: ${OPTIMIZER_DB_PASSWORD:-${DATABASE_PASSWORD}}
      POSTGRES_DB: mdeo
    volumes:
      - postgres-optimizer-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${OPTIMIZER_DB_USER:-${DATABASE_USER}} -d mdeo"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    image: ${MDEO_IMAGE_PREFIX:-ghcr.io/mde-optimiser}/mdeo-backend:${MDEO_IMAGE_TAG:-latest}
    environment:
      DATABASE_URL: ${DATABASE_URL}
      DATABASE_USER: ${BACKEND_DB_USER:-${DATABASE_USER}}
      DATABASE_PASSWORD: ${BACKEND_DB_PASSWORD:-${DATABASE_PASSWORD}}
      # Every HTTP request arrives through the workbench nginx, which appends
      # the address it saw to X-Forwarded-For, and the backend itself is not
      # published. See plugins/ClientAddress.kt.
      TRUSTED_PROXY_HOPS: ${TRUSTED_PROXY_HOPS:-1}
      GIT_SSH_PORT: 2222
      GIT_OAUTH_AUTHORIZE_PATH: /oauth/authorize
      GIT_OAUTH_TOKEN_PATH: /api/oauth/token
      # Defaults to false because this stack publishes only the workbench's
      # port 80, and nginx proxies HTTP only: with nothing mapping 2222 there
      # is no SSH endpoint, and advertising a clone URL for one would only
      # send users at an address that refuses the connection. Set it to true
      # together with the ports mapping below, and set GIT_SSH_HOST_KEY, so
      # clients are not asked to re-accept a new host key on every restart.
      GIT_SSH_PUBLICLY_REACHABLE: "${GIT_SSH_PUBLICLY_REACHABLE:-false}"
      SESSION_MAX_IDLE_SECONDS: ${SESSION_MAX_IDLE_SECONDS}
      SESSION_MAX_ABSOLUTE_SECONDS: ${SESSION_MAX_ABSOLUTE_SECONDS}
      JWT_EXPIRATION_SECONDS: ${JWT_EXPIRATION_SECONDS:-3600}
      JWT_EXECUTION_EXPIRATION_SECONDS: ${JWT_EXECUTION_EXPIRATION_SECONDS:-604800}
      COOKIE_SECURE: ${COOKIE_SECURE}
      COOKIE_SAMESITE: ${COOKIE_SAMESITE}
      CORS_ALLOWED_HOSTS: ${CORS_ALLOWED_HOSTS}
      ADMIN_USERNAME: ${ADMIN_USERNAME}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      PLUGIN_BASE_URL: ${PLUGIN_BASE_URL}
      INTERNAL_PLUGIN_BASE_URL: ${INTERNAL_PLUGIN_BASE_URL:-http://workbench:80}
      DEFAULT_PLUGIN_URLS: ${DEFAULT_PLUGIN_URLS:-http://service-metamodel:3000,http://service-model:3000,http://service-script:3000,http://service-model-transformation:3000,http://service-config:3000,http://service-config-optimization:3000,http://service-config-mdeo:3000,http://service-csv:3000,http://service-model-csv:3000}
    # Uncomment together with GIT_SSH_PUBLICLY_REACHABLE=true above to serve
    # git over SSH, or map the port through whatever L4 ingress fronts this
    # deployment instead.
    # ports:
    #   - "2222:2222"
    depends_on:
      postgres-backend:
        condition: service_healthy
      workbench:
        condition: service_started
    restart: unless-stopped

  workbench:
    image: ${MDEO_IMAGE_PREFIX:-ghcr.io/mde-optimiser}/mdeo-workbench:${MDEO_IMAGE_TAG:-latest}
    environment:
      PLUGIN_METAMODEL_SERVICE: ${PLUGIN_METAMODEL_SERVICE:-http://service-metamodel:3000}
      PLUGIN_MODEL_SERVICE: ${PLUGIN_MODEL_SERVICE:-http://service-model:3000}
      PLUGIN_SCRIPT_SERVICE: ${PLUGIN_SCRIPT_SERVICE:-http://service-script:3000}
      PLUGIN_MODEL_TRANSFORMATION_SERVICE: ${PLUGIN_MODEL_TRANSFORMATION_SERVICE:-http://service-model-transformation:3000}
      PLUGIN_CONFIG_SERVICE: ${PLUGIN_CONFIG_SERVICE:-http://service-config:3000}
      PLUGIN_CONFIG_OPTIMIZATION_SERVICE: ${PLUGIN_CONFIG_OPTIMIZATION_SERVICE:-http://service-config-optimization:3000}
      PLUGIN_CONFIG_MDEO_SERVICE: ${PLUGIN_CONFIG_MDEO_SERVICE:-http://service-config-mdeo:3000}
      PLUGIN_CSV_SERVICE: ${PLUGIN_CSV_SERVICE:-http://service-csv:3000}
      PLUGIN_MODEL_CSV_SERVICE: ${PLUGIN_MODEL_CSV_SERVICE:-http://service-model-csv:3000}
      BACKEND_SERVICE: ${BACKEND_SERVICE:-http://backend:8080}
    ports:
      - "80:80"
    depends_on:
      service-metamodel:
        condition: service_healthy
      service-model:
        condition: service_healthy
      service-script:
        condition: service_healthy
      service-model-transformation:
        condition: service_healthy
      service-config:
        condition: service_healthy
      service-config-optimization:
        condition: service_healthy
      service-config-mdeo:
        condition: service_healthy
      service-csv:
        condition: service_healthy
      service-model-csv:
        condition: service_healthy
    restart: unless-stopped

  service-metamodel:
    image: ${MDEO_IMAGE_PREFIX:-ghcr.io/mde-optimiser}/mdeo-service-metamodel:${MDEO_IMAGE_TAG:-latest}
    environment:
      PORT: "3000"
      HOST: "0.0.0.0"
      BACKEND_API_URL: "http://backend:8080/api"
      MAX_LANGIUM_INSTANCES: "5"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  service-model:
    image: ${MDEO_IMAGE_PREFIX:-ghcr.io/mde-optimiser}/mdeo-service-model:${MDEO_IMAGE_TAG:-latest}
    environment:
      PORT: "3000"
      HOST: "0.0.0.0"
      BACKEND_API_URL: "http://backend:8080/api"
      MAX_LANGIUM_INSTANCES: "5"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  service-csv:
    image: ${MDEO_IMAGE_PREFIX:-ghcr.io/mde-optimiser}/mdeo-service-csv:${MDEO_IMAGE_TAG:-latest}
    environment:
      PORT: "3000"
      HOST: "0.0.0.0"
      BACKEND_API_URL: "http://backend:8080/api"
      MAX_LANGIUM_INSTANCES: "5"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  service-model-csv:
    image: ${MDEO_IMAGE_PREFIX:-ghcr.io/mde-optimiser}/mdeo-service-model-csv:${MDEO_IMAGE_TAG:-latest}
    environment:
      PORT: "3000"
      HOST: "0.0.0.0"
      BACKEND_API_URL: "http://backend:8080/api"
      MAX_LANGIUM_INSTANCES: "5"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  service-script:
    image: ${MDEO_IMAGE_PREFIX:-ghcr.io/mde-optimiser}/mdeo-service-script:${MDEO_IMAGE_TAG:-latest}
    environment:
      PORT: "3000"
      HOST: "0.0.0.0"
      BACKEND_API_URL: "http://backend:8080/api"
      SCRIPT_EXECUTION_SERVICE_URL: ${SCRIPT_EXECUTION_SERVICE_URL:-http://script-execution:8080}
      MAX_LANGIUM_INSTANCES: "5"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  service-model-transformation:
    image: ${MDEO_IMAGE_PREFIX:-ghcr.io/mde-optimiser}/mdeo-service-model-transformation:${MDEO_IMAGE_TAG:-latest}
    environment:
      PORT: "3000"
      HOST: "0.0.0.0"
      BACKEND_API_URL: "http://backend:8080/api"
      MODEL_TRANSFORMATION_EXECUTION_SERVICE_URL: ${MODEL_TRANSFORMATION_EXECUTION_SERVICE_URL:-http://model-transformation-execution:8080}
      MAX_LANGIUM_INSTANCES: "5"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  script-execution:
    image: ${MDEO_IMAGE_PREFIX:-ghcr.io/mde-optimiser}/mdeo-script-execution:${MDEO_IMAGE_TAG:-latest}
    environment:
      SERVER_PORT: "8080"
      DATABASE_URL: ${SCRIPT_EXECUTION_DATABASE_URL:-jdbc:postgresql://postgres-script:5432/mdeo}
      DATABASE_USER: ${SCRIPT_DB_USER:-${DATABASE_USER}}
      DATABASE_PASSWORD: ${SCRIPT_DB_PASSWORD:-${DATABASE_PASSWORD}}
      BACKEND_API_URL: ${SCRIPT_EXECUTION_BACKEND_URL:-http://backend:8080}
      EXECUTION_TIMEOUT_MS: ${EXECUTION_TIMEOUT_MS:-300000}
    depends_on:
      postgres-script:
        condition: service_healthy
      backend:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  model-transformation-execution:
    image: ${MDEO_IMAGE_PREFIX:-ghcr.io/mde-optimiser}/mdeo-model-transformation-execution:${MDEO_IMAGE_TAG:-latest}
    environment:
      SERVER_PORT: "8080"
      DATABASE_URL: ${TRANSFORMATION_EXECUTION_DATABASE_URL:-jdbc:postgresql://postgres-model-transformation:5432/mdeo}
      DATABASE_USER: ${MODEL_TRANSFORMATION_DB_USER:-${DATABASE_USER}}
      DATABASE_PASSWORD: ${MODEL_TRANSFORMATION_DB_PASSWORD:-${DATABASE_PASSWORD}}
      BACKEND_API_URL: ${TRANSFORMATION_EXECUTION_BACKEND_URL:-http://backend:8080}
      EXECUTION_TIMEOUT_MS: ${EXECUTION_TIMEOUT_MS:-300000}
    depends_on:
