        condition: service_healthy
      backend:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  service-config:
    image: ${MDEO_IMAGE_PREFIX:-ghcr.io/mde-optimiser}/mdeo-service-config:${MDEO_IMAGE_TAG:-latest}
    environment:
      PORT: "3000"
      HOST: "0.0.0.0"
      BACKEND_API_URL: "http://backend:8080/api"
      MAX_LANGIUM_INSTANCES: "5"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  service-config-optimization:
    image: ${MDEO_IMAGE_PREFIX:-ghcr.io/mde-optimiser}/mdeo-service-config-optimization:${MDEO_IMAGE_TAG:-latest}
    environment:
      PORT: "3000"
      HOST: "0.0.0.0"
      BACKEND_API_URL: "http://backend:8080/api"
      MAX_LANGIUM_INSTANCES: "5"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  service-config-mdeo:
    image: ${MDEO_IMAGE_PREFIX:-ghcr.io/mde-optimiser}/mdeo-service-config-mdeo:${MDEO_IMAGE_TAG:-latest}
    environment:
      PORT: "3000"
      HOST: "0.0.0.0"
      BACKEND_API_URL: "http://backend:8080/api"
      OPTIMIZER_EXECUTION_SERVICE_URL: ${OPTIMIZER_EXECUTION_SERVICE_URL:-http://optimizer-execution-0:8080}
      MAX_LANGIUM_INSTANCES: "5"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  optimizer-execution-0:
    image: ${MDEO_IMAGE_PREFIX:-ghcr.io/mde-optimiser}/mdeo-optimizer-execution:${MDEO_IMAGE_TAG:-latest}
    environment:
      SERVER_PORT: "8080"
      DATABASE_URL: ${OPTIMIZER_EXECUTION_DATABASE_URL:-jdbc:postgresql://postgres-optimizer:5432/mdeo}
      DATABASE_USER: ${OPTIMIZER_DB_USER:-${DATABASE_USER}}
      DATABASE_PASSWORD: ${OPTIMIZER_DB_PASSWORD:-${DATABASE_PASSWORD}}
      BACKEND_API_URL: ${OPTIMIZER_EXECUTION_BACKEND_URL:-http://backend:8080}
      SCRIPT_TIMEOUT_MS: ${SCRIPT_TIMEOUT_MS:-1000}
      TRANSFORMATION_TIMEOUT_MS: ${TRANSFORMATION_TIMEOUT_MS:-1000}
      NODE_ID: "0"
      PEERS: "http://optimizer-execution-1:8080,http://optimizer-execution-2:8080"
      NODE_URL: "http://optimizer-execution-0:8080"
      WORKER_THREADS: "1"
    depends_on:
      postgres-optimizer:
        condition: service_healthy
      backend:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  optimizer-execution-1:
    image: ${MDEO_IMAGE_PREFIX:-ghcr.io/mde-optimiser}/mdeo-optimizer-execution:${MDEO_IMAGE_TAG:-latest}
    environment:
      SERVER_PORT: "8080"
      DATABASE_URL: ${OPTIMIZER_EXECUTION_DATABASE_URL:-jdbc:postgresql://postgres-optimizer:5432/mdeo}
      DATABASE_USER: ${OPTIMIZER_DB_USER:-${DATABASE_USER}}
      DATABASE_PASSWORD: ${OPTIMIZER_DB_PASSWORD:-${DATABASE_PASSWORD}}
      BACKEND_API_URL: ${OPTIMIZER_EXECUTION_BACKEND_URL:-http://backend:8080}
      SCRIPT_TIMEOUT_MS: ${SCRIPT_TIMEOUT_MS:-1000}
      TRANSFORMATION_TIMEOUT_MS: ${TRANSFORMATION_TIMEOUT_MS:-1000}
      NODE_ID: "1"
      PEERS: "http://optimizer-execution-0:8080,http://optimizer-execution-2:8080"
      NODE_URL: "http://optimizer-execution-1:8080"
      WORKER_THREADS: "1"
    depends_on:
      postgres-optimizer:
        condition: service_healthy
      backend:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  optimizer-execution-2:
